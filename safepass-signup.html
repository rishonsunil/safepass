<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafePass - College Movement Management System</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
    
    :root {
      --primary-color: #4f46e5;
      --primary-light: #6366f1;
      --primary-dark: #4338ca;
      --secondary-color: #f3f4f6;
      --text-color: #1f2937;
      --light-text: #6b7280;
      --danger: #ef4444;
      --success: #10b981;
      --accent: #f59e0b;
      --card-bg: rgba(255, 255, 255, 0.95);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #f0f9ff 0%, #e1e8f0 100%);
      color: var(--text-color);
      line-height: 1.5;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    
    body::before {
      content: '';
      position: absolute;
      top: -50px;
      right: -50px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-dark) 100%);
      opacity: 0.1;
      z-index: -1;
    }
    
    body::after {
      content: '';
      position: absolute;
      bottom: -100px;
      left: -100px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, var(--primary-light) 100%);
      opacity: 0.05;
      z-index: -1;
    }
    
    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 80px);
      position: relative;
      z-index: 1;
    }
    
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: transform 0.3s ease;
    }
    
    .card:hover {
      transform: translateY(-5px);
    }
    
    .card-header {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      padding: 35px 25px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .card-header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
      transform: rotate(30deg);
    }
    
    .header-content {
      position: relative;
      z-index: 2;
    }
    
    .app-logo {
      font-size: 2.2rem;
      font-weight: 700;
      color: white;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .app-logo svg {
      margin-right: 12px;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.2));
    }
    
    .app-subtitle {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    
    .card-body {
      padding: 40px 50px;
      position: relative;
    }
    
    h2 {
      font-size: 1.7rem;
      margin-bottom: 30px;
      color: var(--primary-dark);
      text-align: center;
      font-weight: 600;
      position: relative;
      display: inline-block;
      left: 50%;
      transform: translateX(-50%);
    }
    
    h2::after {
      content: '';
      position: absolute;
      width: 70px;
      height: 3px;
      background: var(--primary-light);
      left: 50%;
      transform: translateX(-50%);
      bottom: -10px;
      border-radius: 2px;
    }
    
    .form-group {
      margin-bottom: 24px;
      position: relative;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-color);
      font-size: 0.95rem;
      transition: all 0.3s;
    }
    
    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      color: var(--text-color);
      transition: all 0.3s;
      background-color: rgba(255, 255, 255, 0.8);
    }
    
    input:focus {
      outline: none;
      border-color: var(--primary-light);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
      background-color: white;
    }
    
    .role-selector {
      display: flex;
      justify-content: space-between;
      margin-bottom: 35px;
      gap: 15px;
    }
    
    .role-option {
      flex: 1;
      text-align: center;
      padding: 20px 15px;
      border-radius: 16px;
      border: 2px solid #e5e7eb;
      cursor: pointer;
      transition: all 0.3s;
      background-color: rgba(255, 255, 255, 0.7);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
      position: relative;
      overflow: hidden;
    }
    
    .role-option::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .role-option:hover::before {
      opacity: 1;
    }
    
    .role-option.active {
      border-color: var(--primary-color);
      background-color: rgba(237, 233, 254, 0.5);
      transform: translateY(-4px);
      box-shadow: 0 8px 15px rgba(79, 70, 229, 0.15);
    }
    
    .role-option:hover:not(.active) {
      border-color: var(--primary-light);
      background-color: rgba(243, 244, 246, 0.8);
      transform: translateY(-2px);
    }
    
    .role-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      margin: 0 auto 15px;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      color: white;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
      transition: all 0.3s;
    }
    
    .role-option:hover .role-icon {
      transform: scale(1.05);
    }
    
    .role-option.active .role-icon {
      transform: scale(1.1);
      box-shadow: 0 6px 15px rgba(79, 70, 229, 0.3);
    }
    
    .role-name {
      font-weight: 500;
      font-size: 1rem;
      color: var(--primary-dark);
      transition: all 0.3s;
    }
    
    .role-option.active .role-name {
      font-weight: 600;
    }
    
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 15px rgba(79, 70, 229, 0.25);
    }
    
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: 0.5s;
    }
    
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(79, 70, 229, 0.35);
    }
    
    .btn:hover::before {
      left: 100%;
    }
    
    .footer {
      text-align: center;
      margin-top: 30px;
      color: var(--light-text);
      font-size: 0.95rem;
      position: relative;
    }
    
    .footer a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s;
    }
    
    .footer a:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }
    
    /* Floating shapes */
    .shapes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }
    
    .shape {
      position: absolute;
      border-radius: 50%;
    }
    
    .shape-1 {
      top: 20%;
      right: -50px;
      width: 120px;
      height: 120px;
      background: linear-gradient(to right, var(--primary-light), var(--primary-dark));
      opacity: 0.05;
    }
    
    .shape-2 {
      bottom: 15%;
      left: -30px;
      width: 80px;
      height: 80px;
      background: var(--accent);
      opacity: 0.07;
    }
    
    .shape-3 {
      top: 50%;
      right: 15%;
      width: 60px;
      height: 60px;
      background: var(--success);
      opacity: 0.05;
    }
    
    /* Responsive adjustments */
    @media (max-width: 768px) {
      .container {
        margin: 20px auto;
      }
      
      .card-body {
        padding: 30px;
      }
      
      .role-selector {
        flex-wrap: wrap;
      }
      
      .role-option {
        flex: 1 0 100%;
        margin-bottom: 10px;
      }
      
      .app-logo {
        font-size: 1.8rem;
      }
      
      h2 {
        font-size: 1.5rem;
      }
    }
    
    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes floatY {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    
    .card {
      animation: fadeInUp 0.8s ease-out forwards;
    }
    
    .app-logo {
      animation: floatY 6s ease-in-out infinite;
    }
    
    .form-group {
      animation: fadeInUp 0.6s ease-out forwards;
      opacity: 0;
    }
    
    .form-group:nth-child(1) { animation-delay: 0.2s; }
    .form-group:nth-child(2) { animation-delay: 0.3s; }
    .form-group:nth-child(3) { animation-delay: 0.4s; }
    .form-group:nth-child(4) { animation-delay: 0.5s; }
    .form-group:nth-child(5) { animation-delay: 0.6s; }
    
    .role-option {
      animation: fadeInUp 0.5s ease-out forwards;
      opacity: 0;
    }
    
    .role-option:nth-child(1) { animation-delay: 0.1s; }
    .role-option:nth-child(2) { animation-delay: 0.2s; }
    .role-option:nth-child(3) { animation-delay: 0.3s; }
    
    .role-icon {
      animation: pulse 3s ease-in-out infinite;
    }
    
    .shape-1 {
      animation: floatY 10s ease-in-out infinite;
    }
    
    .shape-2 {
      animation: floatY 12s ease-in-out infinite reverse;
    }
    
    .shape-3 {
      animation: floatY 9s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>
    
    <div class="card">
      <div class="card-header">
        <div class="header-content">
          <div class="app-logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            SafePass
          </div>
          <div class="app-subtitle">College Movement Management System</div>
        </div>
      </div>
      
      <div class="card-body">
        <h2>Create Your Account</h2>
        
        <form id="signupForm">
          <label>Select Your Role</label>
          <div class="role-selector">
            <div class="role-option active" data-role="student">
              <div class="role-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                  <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                </svg>
              </div>
              <div class="role-name">Student</div>
            </div>
            
            <div class="role-option" data-role="faculty">
              <div class="role-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 8h1a4 4 0 1 1 0 8h-1"></path>
                  <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                  <line x1="6" y1="1" x2="6" y2="4"></line>
                  <line x1="10" y1="1" x2="10" y2="4"></line>
                  <line x1="14" y1="1" x2="14" y2="4"></line>
                </svg>
              </div>
              <div class="role-name">Faculty</div>
            </div>
            
            <div class="role-option" data-role="warden">
              <div class="role-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
                  <path d="M21.18 8.94c.29.71.44 1.48.44 2.28"></path>
                  <path d="M2.38 12.18c.14.68.39 1.31.73 1.88"></path>
                  <path d="M8.12 20.94c1.2.51 2.5.8 3.88.8"></path>
                </svg>
              </div>
              <div class="role-name">Warden</div>
            </div>
          </div>
          
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name" required>
          </div>
          
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter your phone number" required>
          </div>
          
          <div class="form-group">
            <label for="idNumber">Student/Employee ID</label>
            <input type="text" id="idNumber" placeholder="Enter your ID number" required>
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a strong password" required>
          </div>
          
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
          </div>
          
          <div class="form-group">
            <button type="submit" class="btn">Create Account</button>
          </div>
        </form>
        
        <div class="footer">
          Already have an account? <a href="#">Sign In</a>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    // Simple role selector functionality
    const roleOptions = document.querySelectorAll('.role-option');
    
    roleOptions.forEach(option => {
      option.addEventListener('click', () => {
        roleOptions.forEach(opt => opt.classList.remove('active'));
        option.classList.add('active');
      });
    });
    
    // Form submission prevention (demo only)
    document.getElementById('signupForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Account creation would be processed here in a real application.');
    });
  </script>
</body>
</html>
